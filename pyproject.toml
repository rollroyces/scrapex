[project]
name = "scrapex"
version = "0.1.0"
description = "AI-friendly web scraping for Python — URL + schema in, clean markdown + JSON out"
readme = "README.md"
license = "AGPL-3.0-or-later"
# NOTE: PEP 639 forbids mixing ``license = "..."`` SPDX expressions with
# ``License ::`` classifiers — pick one. We use the SPDX expression so that
# the license metadata is machine-readable. The classifier form would be:
#   classifiers += ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
authors = [{ name = "rollroyces", email = "hello@rollroyces.dev" }]
requires-python = ">=3.10"
keywords = ["scraping", "crawler", "ai", "llm", "rag", "markdown", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.5",
    "trafilatura>=1.6",
    "tenacity>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
# Bring-your-own LLM via litellm — keep it optional so the lib installs lean
llm = ["litellm>=1.40"]
# Browser rendering for JS-heavy pages
browser = ["playwright>=1.40"]
# Anti-bot bypass (Cloudflare etc.)
stealth = ["cloudscraper>=1.2"]
# All optional features
all = ["scrapex[llm,browser,stealth]"]
dev = [
    "scrapex[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",  # httpx mocking for tests
]

[project.urls]
Homepage = "https://github.com/rollroyces/scrapex"
Documentation = "https://github.com/rollroyces/scrapex#readme"
Issues = "https://github.com/rollroyces/scrapex/issues"
Source = "https://github.com/rollroyces/scrapex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapex"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Per-file overrides — tests don't need docstrings; their names ARE the docs.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "N"]
"examples/**/*.py" = ["D"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
# D = pydocstyle (PEP 257). We enforce the rules below; ignore the noisy ones
# that don't matter for a small library (e.g. docstring-on-everything).
ignore = [
    "E501",  # line-length handled by formatter
    "D100",  # missing module docstring (covered separately)
    "D104",  # missing docstring in public package (covered separately)
    "D107",  # missing docstring in __init__ (init docstrings are noise)
    "D203",  # 1 blank line before class docstring (incompatible with D211)
    "D213",  # multi-line summary on second line (incompatible with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Google-style docstrings (PEP 257 compliant)

[tool.ruff.format]
# Use double quotes for strings (consistent with existing code)
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]