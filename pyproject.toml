[project]
name = "scrapex"
version = "0.1.0"
description = "AI-friendly web scraping for Python — URL + schema in, clean markdown + JSON out"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "rollroyces", email = "hello@rollroyces.dev" }]
requires-python = ">=3.10"
keywords = ["scraping", "crawler", "ai", "llm", "rag", "markdown", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.5",
    "trafilatura>=1.6",
    "tenacity>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
# Bring-your-own LLM via litellm — keep it optional so the lib installs lean
llm = ["litellm>=1.40"]
# Browser rendering for JS-heavy pages
browser = ["playwright>=1.40"]
# Anti-bot bypass (Cloudflare etc.)
stealth = ["cloudscraper>=1.2"]
# All optional features
all = ["scrapex[llm,browser,stealth]"]
dev = [
    "scrapex[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",  # httpx mocking for tests
]

[project.urls]
Homepage = "https://github.com/rollroyces/scrapex"
Documentation = "https://github.com/rollroyces/scrapex#readme"
Issues = "https://github.com/rollroyces/scrapex/issues"
Source = "https://github.com/rollroyces/scrapex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapex"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]