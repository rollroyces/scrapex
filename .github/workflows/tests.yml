name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check scrapex tests

      - name: Mypy
        run: |
          uv run mypy scrapex \
            --ignore-missing-imports \
            --no-implicit-optional \
            --warn-unreachable \
            --check-untyped-defs

      - name: Pytest (no live LLM)
        run: |
          uv run pytest -q \
            --ignore=tests/integration/test_heal_live.py \
            --ignore=tests/integration/test_heal_real_websites.py

      - name: Coverage
        run: |
          uv run pytest -q \
            --ignore=tests/integration/test_heal_live.py \
            --ignore=tests/integration/test_heal_real_websites.py \
            --cov=scrapex --cov-report=term-missing --cov-fail-under=80
        env:
          SKIP_LIVE: "1"